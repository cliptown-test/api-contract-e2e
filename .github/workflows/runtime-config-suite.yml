name: runtime-config-suite

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  semantic-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_GITHUB_ORG: ${{ github.repository_owner }}
    steps:
      - name: Check out exact test candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run adversarial TOML role and secret-boundary corpus
        run: python3 -m unittest tests/runtime_config_suite_test.py -v
  middleware-tjsv:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact test candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false
      - name: Check out immutable ORES middleware authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-middleware
          ref: ee75f0a67cf23895500846402fbc757aa0686530
          path: _authority/ores-middleware
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.1"
          package-manager-cache: false
      - name: Install immutable middleware dependencies
        working-directory: _authority/ores-middleware
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exercise canonical manifest hardening before parity
        working-directory: _authority/ores-middleware
        run: npm run ores-mw:check
      - name: Exercise local TJSV receipt admission policy
        working-directory: _authority/ores-middleware
        run: npm run ores-mw:tjsv:test
      - name: Check out middleware's reviewed TJSV implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: 4473504c4c9d2831d825919f70c03994d8ce01d2
          path: _authority/ores-middleware/target/tools/tjsv
          persist-credentials: false
          show-progress: false
      - name: Install exact TJSV dependency closure
        run: npm ci --prefix _authority/ores-middleware/target/tools/tjsv --ignore-scripts --no-audit --no-fund
      - name: Build only the locked flags-2-env native dependency
        working-directory: _authority/ores-middleware/target/tools/tjsv
        run: |
          set -euo pipefail
          npm rebuild @oresoftware/f2e --ignore-scripts=false --no-audit --no-fund
          test -s node_modules/@oresoftware/f2e/clients/nodejs/build/Release/flags2env.node
      - name: Require canonical source and differential contract parity
        working-directory: _authority/ores-middleware
        run: npm run ores-mw:tjsv
      - name: Prove immutable authority inputs were not rewritten
        working-directory: _authority/ores-middleware
        run: |
          set -euo pipefail
          git diff --exit-code -- .ores-mw.toml contracts/ores-mw-config contracts/tjsv-instances/ores-mw-config fixtures/ores-mw scripts/ores_mw_config.py scripts/check-tjsv-ores-mw.mjs tests/test_ores_mw_config.py tests/test_ores_mw_output_hardening.py tests/tjsv-ores-mw-config.test.mjs package.json package-lock.json
